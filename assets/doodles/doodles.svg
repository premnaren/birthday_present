<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- 1. Leaf Sprig -->
    <symbol id="doodle-leaf-sprig" viewBox="0 0 40 40">
      <path d="M6 34 C12 28, 22 18, 34 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M16 24 C14 18, 18 13, 24 16 C22 22, 18 23, 16 24 Z" fill="#B7C9A8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M25 15 C26 9, 32 8, 33 14 C30 18, 27 17, 25 15 Z" fill="#B7C9A8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M22 26 C26 25, 30 29, 28 34 C23 33, 22 28, 22 26 Z" fill="#B7C9A8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M12 30 C9 27, 8 22, 13 22 C14 26, 13 29, 12 30 Z" fill="#B7C9A8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>

    <!-- 2. Sketched Heart -->
    <symbol id="doodle-heart" viewBox="0 0 32 32">
      <path d="M16 28 C12 23, 3 17, 3 10 C3 5.5, 6.8 2, 11.5 2 C14.2 2, 15.6 3.5, 16 4.2 C16.4 3.5, 17.8 2, 20.5 2 C25.2 2, 29 5.5, 29 10 C29 17, 20 23, 16 28 Z" fill="#F4C2C7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Inner sketch highlight -->
      <path d="M7 9 C7 7, 9 5, 11 4.5" stroke="#FFFDF8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </symbol>

    <!-- 3. Sparkle / Starburst -->
    <symbol id="doodle-sparkle" viewBox="0 0 32 32">
      <path d="M16 2 C16 10, 18 14, 28 16 C18 18, 16 22, 16 30 C16 22, 14 18, 4 16 C14 14, 16 10, 16 2 Z" fill="#F7E3A1" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="27" cy="6" r="1.5" fill="currentColor"/>
      <circle cx="6" cy="25" r="1.5" fill="currentColor"/>
    </symbol>

    <!-- 4. Comic Action Burst -->
    <symbol id="doodle-burst" viewBox="0 0 40 40">
      <path d="M20 3 L23 12 L32 8 L28 17 L38 20 L29 24 L34 32 L24 29 L21 38 L17 29 L8 34 L12 24 L3 20 L12 17 L7 8 L17 12 Z" fill="#FEE2E2" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>

    <!-- 5. Paper Airplane -->
    <symbol id="doodle-plane" viewBox="0 0 36 36">
      <path d="M4 16 L32 4 L20 32 L15 21 Z" fill="#FFFDF8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M15 21 L32 4" stroke="currentColor" stroke-width="1.8"/>
      <path d="M15 21 L18 27 L20 32" stroke="currentColor" stroke-width="1.8" fill="#F3EBE0"/>
      <!-- Flight trail dashed -->
      <path d="M3 24 C5 26, 7 24, 9 26" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
    </symbol>

    <!-- 6. Vintage Polaroid Camera -->
    <symbol id="doodle-camera" viewBox="0 0 40 36">
      <rect x="4" y="8" width="32" height="24" rx="4" fill="#FCE4E8" stroke="currentColor" stroke-width="2"/>
      <path d="M13 8 L16 3 L24 3 L27 8 Z" fill="#FAF5ED" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="20" cy="20" r="7" fill="#FFFDF8" stroke="currentColor" stroke-width="2"/>
      <circle cx="20" cy="20" r="4" fill="#3A2F32"/>
      <circle cx="7" cy="12" r="1.5" fill="#D98A9B"/>
      <rect x="29" y="11" width="4" height="2" fill="currentColor"/>
    </symbol>

    <!-- 7. Glass Memory Jar -->
    <symbol id="doodle-jar" viewBox="0 0 36 44">
      <!-- Cork Lid -->
      <rect x="11" y="2" width="14" height="5" rx="1.5" fill="#D5A97D" stroke="currentColor" stroke-width="1.8"/>
      <!-- Rim -->
      <rect x="9" y="6" width="18" height="3" rx="1" fill="#FFFDF8" stroke="currentColor" stroke-width="1.8"/>
      <!-- Jar Glass Body -->
      <path d="M9 9 C7 11, 5 14, 5 18 L5 36 C5 41, 9 42, 18 42 C27 42, 31 41, 31 36 L31 18 C31 14, 29 11, 27 9 Z" fill="#E8F4F8" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/>
      <!-- Highlights and paper slips -->
      <path d="M8 17 L8 34" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
      <rect x="10" y="27" width="6" height="10" rx="1" fill="#FCE4E8" stroke="currentColor" stroke-width="1.2" transform="rotate(-15 13 32)"/>
      <rect x="18" y="26" width="6" height="11" rx="1" fill="#FEF3C7" stroke="currentColor" stroke-width="1.2" transform="rotate(20 21 31)"/>
    </symbol>

    <!-- 8. Fresh Strawberry -->
    <symbol id="doodle-strawberry" viewBox="0 0 32 36">
      <!-- Berry body -->
      <path d="M16 34 C12 32, 4 23, 4 14 C4 8.5, 9 6, 16 6 C23 6, 28 8.5, 28 14 C28 23, 20 32, 16 34 Z" fill="#E04D6B" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <!-- Green Leaf Cap -->
      <path d="M16 8 C14 3, 9 4, 9 4 C11 7, 13 8, 14 8 C11 9, 8 11, 8 11 C11 11, 14 10, 16 9 C18 10, 21 11, 24 11 C24 11, 21 9, 18 8 C19 8, 21 7, 23 4 C23 4, 18 3, 16 8 Z" fill="#88C299" stroke="currentColor" stroke-width="1.5"/>
      <!-- Stem -->
      <path d="M16 4 C16 1, 18 1, 18 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Seeds -->
      <circle cx="12" cy="14" r="0.9" fill="#FFFDF8"/>
      <circle cx="19" cy="13" r="0.9" fill="#FFFDF8"/>
      <circle cx="10" cy="20" r="0.9" fill="#FFFDF8"/>
      <circle cx="16" cy="19" r="0.9" fill="#FFFDF8"/>
      <circle cx="22" cy="19" r="0.9" fill="#FFFDF8"/>
      <circle cx="13" cy="25" r="0.9" fill="#FFFDF8"/>
      <circle cx="18" cy="25" r="0.9" fill="#FFFDF8"/>
    </symbol>

    <!-- 9. Layer Cake Slice -->
    <symbol id="doodle-cake-slice" viewBox="0 0 36 32">
      <path d="M4 25 L32 25 L32 14 L18 8 L4 17 Z" fill="#FDF2E2" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <!-- Frosting Top -->
      <path d="M4 17 L18 8 L32 14" stroke="currentColor" stroke-width="2" fill="none"/>
      <!-- Middle Cream Layer -->
      <path d="M4 21 L32 21" stroke="#F4C2C7" stroke-width="2.5" stroke-dasharray="4 2"/>
      <!-- Cherry on Top -->
      <circle cx="18" cy="6" r="3" fill="#C8483F" stroke="currentColor" stroke-width="1.5"/>
      <path d="M19 4 C22 1, 24 2, 24 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>

    <!-- 10. Cozy Teacup / Chai Mug -->
    <symbol id="doodle-teacup" viewBox="0 0 36 30">
      <path d="M6 8 L8 22 C9 26, 21 26, 22 22 L24 8 Z" fill="#FBE6D6" stroke="currentColor" stroke-width="2"/>
      <!-- Handle -->
      <path d="M24 11 C28 11, 28 19, 23 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Saucer line -->
      <path d="M4 26 L26 26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <!-- Steam Wisps -->
      <path d="M11 5 C10 3, 12 1, 11 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M16 6 C15 3, 17 2, 16 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </symbol>

    <!-- 11. Pushpin / Corkboard Pin -->
    <symbol id="doodle-pushpin" viewBox="0 0 24 32">
      <!-- Pin head cap -->
      <ellipse cx="12" cy="7" rx="6" ry="4" fill="#C8483F" stroke="currentColor" stroke-width="1.8"/>
      <!-- Pin barrel -->
      <path d="M9 7 L10 16 L14 16 L15 7 Z" fill="#D98A9B" stroke="currentColor" stroke-width="1.5"/>
      <ellipse cx="12" cy="16" rx="4" ry="2" fill="#3A2F32"/>
      <!-- Needle point -->
      <path d="M12 18 L12 28" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- 12. Paintbrush -->
    <symbol id="doodle-paintbrush" viewBox="0 0 36 36">
      <path d="M28 4 L32 8 L18 22 L14 18 Z" fill="#D5A97D" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <!-- Ferrule metal -->
      <path d="M14 18 L18 22 L15 25 L11 21 Z" fill="#D1D5DB" stroke="currentColor" stroke-width="1.8"/>
      <!-- Bristles with paint tip -->
      <path d="M11 21 L15 25 C14 28, 8 32, 5 31 C4 28, 8 22, 11 21 Z" fill="#60A5FA" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>

    <!-- 13. Aarav - Beach / Palm Island -->
    <symbol id="doodle-beach" viewBox="0 0 44 44">
      <circle cx="32" cy="12" r="5" fill="#F59E0B" stroke="currentColor" stroke-width="1.5"/>
      <!-- Palm trunk -->
      <path d="M16 36 C18 28, 22 22, 26 16" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Palm fronds -->
      <path d="M26 16 C22 12, 14 14, 13 18 C17 17, 23 17, 26 16 Z" fill="#88C299" stroke="currentColor" stroke-width="1.5"/>
      <path d="M26 16 C30 11, 38 12, 38 17 C34 16, 29 16, 26 16 Z" fill="#88C299" stroke="currentColor" stroke-width="1.5"/>
      <path d="M26 16 C27 9, 24 4, 21 6 C22 10, 24 14, 26 16 Z" fill="#88C299" stroke="currentColor" stroke-width="1.5"/>
      <!-- Shoreline wave -->
      <path d="M4 38 Q12 34 22 38 T40 38" stroke="currentColor" stroke-width="2" fill="none"/>
    </symbol>

    <!-- 14. Simran & Tanvi - Dancing Silhouette -->
    <symbol id="doodle-dance" viewBox="0 0 40 44">
      <circle cx="20" cy="8" r="4" fill="#CDB8E3" stroke="currentColor" stroke-width="1.8"/>
      <!-- Body & Dress -->
      <path d="M20 12 L20 20 L12 28 C18 30, 26 30, 30 26 L22 20 Z" fill="#F4C2C7" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <!-- Raised Arms -->
      <path d="M13 14 C15 16, 18 16, 20 15 C23 13, 27 10, 30 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Dancing Legs -->
      <path d="M18 28 L16 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 27 L28 36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <!-- Little music note -->
      <path d="M32 18 L32 12 L36 10 L36 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </symbol>

    <!-- 15. Kabir - Midnight Pizza Slice -->
    <symbol id="doodle-pizza" viewBox="0 0 40 40">
      <!-- Crust -->
      <path d="M8 12 Q20 4 32 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Slice Body -->
      <path d="M8 12 L20 36 L32 12 Q20 6 8 12 Z" fill="#FEF3C7" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <!-- Pepperoni Circles -->
      <circle cx="16" cy="18" r="2.8" fill="#E04D6B" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="23" cy="22" r="2.8" fill="#E04D6B" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="19" cy="29" r="2" fill="#E04D6B" stroke="currentColor" stroke-width="1.2"/>
    </symbol>

    <!-- 16. Diya - Handcrafted Ceramic Pottery -->
    <symbol id="doodle-pottery" viewBox="0 0 38 42">
      <!-- Vase neck and body -->
      <ellipse cx="19" cy="6" rx="7" ry="2.5" fill="#FAF5ED" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 7 C12 12, 6 18, 6 26 C6 35, 12 38, 19 38 C26 38, 32 35, 32 26 C32 18, 26 12, 26 7 Z" fill="#B7C9A8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <!-- Painted tribal line -->
      <path d="M9 24 Q19 28 29 24" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <path d="M10 28 Q19 32 28 28" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>
    </symbol>

    <!-- 17. Dev - DJ Headphones -->
    <symbol id="doodle-headphones" viewBox="0 0 40 40">
      <!-- Headband -->
      <path d="M8 22 C8 11, 13 6, 20 6 C27 6, 32 11, 32 22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Left Earcup -->
      <rect x="5" y="20" width="7" height="13" rx="3.5" fill="#60A5FA" stroke="currentColor" stroke-width="1.8"/>
      <!-- Right Earcup -->
      <rect x="28" y="20" width="7" height="13" rx="3.5" fill="#60A5FA" stroke="currentColor" stroke-width="1.8"/>
      <!-- Audio wave -->
      <path d="M16 26 L17 22 L19 30 L21 21 L23 28 L24 25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </symbol>

    <!-- 18. Arjun - Golden Sunset -->
    <symbol id="doodle-sunset" viewBox="0 0 42 36">
      <path d="M4 26 L38 26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <!-- Half Sun -->
      <path d="M12 26 A9 9 0 0 1 30 26 Z" fill="#F59E0B" stroke="currentColor" stroke-width="2"/>
      <!-- Sun rays -->
      <path d="M21 11 L21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 15 L8 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M30 15 L34 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <!-- Water ripples -->
      <path d="M10 30 L32 30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M15 33 L27 33" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </symbol>

    <!-- 19. Mom's Hand-drawn Portrait Monogram -->
    <symbol id="doodle-portrait-mom" viewBox="0 0 54 54">
      <circle cx="27" cy="27" r="24" fill="#FDE8ED" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/>
      <!-- Stylized motherly silhouette / heart blossom -->
      <path d="M27 12 C23 12, 19 16, 19 21 C19 27, 27 34, 27 34 C27 34, 35 27, 35 21 C35 16, 31 12, 27 12 Z" fill="#D98A9B" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M20 38 C22 36, 25 35, 27 35 C29 35, 32 36, 34 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <!-- Blooming floral twig -->
      <path d="M22 44 Q27 41 32 44" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </symbol>

    <!-- 20. Daddy's Hand-drawn Portrait Monogram -->
    <symbol id="doodle-portrait-daddy" viewBox="0 0 54 54">
      <circle cx="27" cy="27" r="24" fill="#E8F0FE" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/>
      <!-- Stylized star badge / protector emblem -->
      <polygon points="27,13 30,22 39,22 32,27 35,36 27,31 19,36 22,27 15,22 24,22" fill="#F5BE59" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="27" cy="24" r="3" fill="#FFFDF8"/>
      <path d="M18 42 Q27 38 36 42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </symbol>

    <!-- 21. Sister / OG Opp Snapshot -->
    <symbol id="doodle-sister-snap" viewBox="0 0 50 46">
      <!-- Two heads side by side -->
      <circle cx="18" cy="16" r="8" fill="#FCE4E8" stroke="currentColor" stroke-width="2"/>
      <circle cx="32" cy="17" r="8" fill="#FEF3C7" stroke="currentColor" stroke-width="2"/>
      <!-- Fun hair bun on sister 1 -->
      <circle cx="14" cy="9" r="4" fill="#D98A9B" stroke="currentColor" stroke-width="1.5"/>
      <!-- Fun ponytail on sister 2 -->
      <path d="M37 13 C41 12, 42 16, 40 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Shared hugs / arms -->
      <path d="M12 28 C14 24, 22 24, 25 28" stroke="currentColor" stroke-width="2" fill="#FAF5ED"/>
      <path d="M25 28 C28 24, 36 24, 38 28" stroke="currentColor" stroke-width="2" fill="#FAF5ED"/>
      <path d="M18 24 L32 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- 22. Wax Seal Star -->
    <symbol id="doodle-wax-star" viewBox="0 0 24 24">
      <path d="M12 2 L14.5 8.5 L21.5 9 L16 14 L18 21 L12 17 L6 21 L8 14 L2.5 9 L9.5 8.5 Z" fill="#FFE266" stroke="#9E2A2B" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>

    <!-- 23. Hand-drawn Arrow Sketch -->
    <symbol id="doodle-arrow-sketch" viewBox="0 0 36 24">
      <path d="M3 12 C10 10, 22 11, 31 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M24 5 C27 8, 30 11, 33 12 C30 14, 27 17, 24 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>
  </defs>
</svg>
